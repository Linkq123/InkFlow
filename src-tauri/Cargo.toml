[package]
name = "inkflow"
version = "0.1.3"
description = "A local-first, focused Markdown editor for Windows"
authors = ["InkFlow contributors"]
edition = "2024"
rust-version = "1.85"
default-run = "inkflow"

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-window-state",
  "dep:webview2-com",
]
cli = ["dep:clap", "dep:ctrlc", "dep:schemars"]

[lib]
name = "inkflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "inkflow"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "inkflow-cli"
path = "src/bin/inkflow-cli.rs"
required-features = ["cli"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
atomic-write-file = "0.3.0"
base64 = "0.23.1"
blake3 = "1.8.2"
chardetng = "1.0.0"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"], optional = true }
ctrlc = { version = "3.5.1", optional = true }
directories = "6.0.0"
dunce = "1.0.5"
encoding_rs = "0.8.35"
ignore = "0.4.24"
html-escape = "0.2.15"
parking_lot = "0.12.5"
pulldown-cmark = "0.13.0"
regex = "1.12.2"
schemars = { version = "1.2.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.6.0", optional = true }
tauri-plugin-opener = { version = "2.5.0", optional = true }
tauri-plugin-single-instance = { version = "2.4.0", optional = true }
tauri-plugin-window-state = { version = "2.4.0", optional = true }
thiserror = "2.0.17"
trash = "5.2.3"
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "=0.38.2", optional = true }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.23.0"
