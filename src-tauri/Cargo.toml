[package]
name = "inkflow"
version = "0.1.0"
description = "A local-first, focused Markdown editor for Windows"
authors = ["InkFlow contributors"]
edition = "2024"
rust-version = "1.85"
default-run = "inkflow"

[lib]
name = "inkflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
atomic-write-file = "0.3.0"
base64 = "0.22.1"
blake3 = "1.8.2"
chardetng = "0.1.17"
chrono = { version = "0.4.42", features = ["serde"] }
directories = "6.0.0"
encoding_rs = "0.8.35"
ignore = "0.4.24"
parking_lot = "0.12.5"
pulldown-cmark = "0.13.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2.5.0"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-window-state = "2.4.0"
thiserror = "2.0.17"
trash = "5.2.3"
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "=0.61.3"

[dev-dependencies]
tempfile = "3.23.0"
