name: Bug 报告 / Bug report
description: 报告可复现的错误、崩溃、数据安全或性能问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要上传包含隐私、密钥或业务数据的 Markdown、恢复文件和截图；必要时请先制作最小脱敏示例。

  - type: input
    id: inkflow-version
    attributes:
      label: InkFlow 版本
      description: 可在安装应用列表或 Release 文件名中查看。
      placeholder: 例如 0.1.2
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: Windows 版本
      options:
        - Windows 10 22H2
        - Windows 11
        - 其他 Windows 版本
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: 使用方式
      options:
        - NSIS 安装版
        - 便携 ZIP
        - 本地开发构建
    validations:
      required: true

  - type: input
    id: display-environment
    attributes:
      label: 显示与输入环境
      description: 请填写 DPI、明暗主题、高对比度、减少动态效果和输入法等相关信息。
      placeholder: 例如 150% DPI、深色主题、微软拼音

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 输入或点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: dropdown
    id: data-impact
    attributes:
      label: 数据影响
      options:
        - 无数据影响
        - 未保存内容可能受影响
        - 已保存文件可能受影响
        - 不确定
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可提供脱敏后的最小示例、截图或错误信息。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认反馈中不包含隐私、密钥或未脱敏的业务文档。
          required: true
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
